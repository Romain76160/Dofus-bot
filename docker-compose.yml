services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ALLOW_INPUT: "false"
      VISION_ENABLED: "false"
      NETWORK_OBSERVER_ENABLED: "false"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    depends_on:
      - backend
